name: Update Java Manifest

on:
   schedule:
      - cron: "0 0 * * *"
   workflow_dispatch:

jobs:
   update:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - name: Set up Python
           uses: actions/setup-python@v5
           with:
              python-version: "3.12"

         - name: Install dependencies
           run: pip install requests

         - name: Run Java manifest generator
           run: python scripts/gen-java.py

         - name: Commit and push if changed
           run: |
              git config user.name "InuSDK Bot"
              git config user.email "bot@inusdk.dev"
              git add manifests/java.json
              git diff --staged --quiet || (git commit -m "Chore: update java manifest"
